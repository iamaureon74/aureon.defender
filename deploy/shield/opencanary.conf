{
  "device.node_id": "aureon-canary",
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "handlers": {
        "console": { "class": "logging.StreamHandler", "stream": "ext://sys.stdout" },
        "file": { "class": "logging.FileHandler", "filename": "/var/log/opencanary/opencanary.log" }
      }
    }
  },
  "ssh.enabled": true,
  "ssh.port": 2222,
  "ssh.version": "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3",
  "http.enabled": true,
  "http.port": 80,
  "http.banner": "Apache/2.4.52 (Ubuntu)",
  "http.skin": "nasLogin",
  "smb.enabled": false,
  "portscan.enabled": false
}
