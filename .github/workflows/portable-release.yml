name: Portable preview release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive preview downloads
        required: true
        default: v0.4.1
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TARGET_OS: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.3 psutil==7.2.2
      - run: python -m unittest portable.test_portable -v
      - run: python -m portable.app --self-test
      - name: Confirm native architecture
        run: python -c "import os,platform; actual=platform.machine().lower().replace('aarch64','arm64'); assert actual==os.environ['TARGET_ARCH'], (actual,os.environ['TARGET_ARCH'])"
      - name: Native package and smoke test
        shell: bash
        run: |
          if [ "$TARGET_OS" = macos ]; then
            python -m PyInstaller --noconfirm --clean --onedir --windowed --name Aureon-Defender-Preview --osx-bundle-identifier org.aureon.defender.preview --paths . --paths windows --hidden-import aureon_defender.hwguard --hidden-import aureon_defender.scanner --hidden-import aureon_defender.quarantine --add-data 'windows/aureon_defender/rules:aureon_defender/rules' --add-data 'portable/dashboard.html:portable' portable/launcher.py
            dist/Aureon-Defender-Preview.app/Contents/MacOS/Aureon-Defender-Preview --self-test
            ditto -c -k --keepParent dist/Aureon-Defender-Preview.app "aureon-defender-macos-${TARGET_ARCH}-preview.zip"
          else
            python -m PyInstaller --noconfirm --clean --onedir --name Aureon-Defender-Preview --paths . --paths windows --hidden-import aureon_defender.hwguard --hidden-import aureon_defender.scanner --hidden-import aureon_defender.quarantine --add-data 'windows/aureon_defender/rules:aureon_defender/rules' --add-data 'portable/dashboard.html:portable' portable/launcher.py
            dist/Aureon-Defender-Preview/Aureon-Defender-Preview --self-test
            tar -czf "aureon-defender-linux-${TARGET_ARCH}-preview.tar.gz" -C dist Aureon-Defender-Preview
          fi
      - name: Attach preview after checks pass
        shell: bash
        run: |
          asset=$(find . -maxdepth 1 -name 'aureon-defender-*-preview.*' -type f | head -1)
          python -c 'import hashlib,sys,pathlib;p=pathlib.Path(sys.argv[1]);pathlib.Path(str(p)+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")' "$asset"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --clobber --repo "$GITHUB_REPOSITORY"
