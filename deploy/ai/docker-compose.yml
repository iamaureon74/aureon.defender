# Aureon AI - private LLM on the Node (or a laptop with a GPU).
#   docker compose up -d
#   docker exec -it aureon-ai-ollama-1 ollama pull qwen2.5:3b     # 8GB Pi 5 / any laptop
#   (16GB+: qwen2.5:7b or llama3.1:8b)
# Open WebUI: http://<node>:8080 (over WireGuard). The security analyst (python -m aureon analyst)
# talks to Ollama on :11434.

name: aureon-ai

services:
  ollama:               # ollama/ollama (llama.cpp inside)
    image: ollama/ollama:0.4.7
    restart: unless-stopped
    ports: [ "127.0.0.1:11434:11434" ]   # localhost only; analyst runs on the same host
    volumes: [ "./data/ollama:/root/.ollama" ]
    # NVIDIA laptop/desktop: uncomment
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }

  open-webui:           # open-webui/open-webui - chat UI with local document RAG
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"     # first account becomes admin; then signups stay closed
    ports: [ "8080:8080" ]
    volumes: [ "./data/open-webui:/app/backend/data" ]

  analyst:              # aureon/analyst.py on a timer: summarises shield alerts with the local model
    image: python:3.12-slim
    restart: unless-stopped
    depends_on: [ollama]
    working_dir: /aureon
    environment:
      AUREON_LLM_URL: http://ollama:11434
      AUREON_LLM_MODEL: ${AUREON_LLM_MODEL:-qwen2.5:3b}
    volumes:
      - ../../aureon:/aureon/aureon:ro
      - ../shield/data:/shield:ro
      - ./data/reports:/reports
    command: >
      sh -c "while true; do
        python -m aureon analyst
          --suricata /shield/suricata/log/eve.json
          --canary /shield/opencanary/opencanary.log
          --since 1h --out /reports/latest.md;
        sleep 3600; done"
